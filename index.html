<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kertészeti Tudástár</title>
<style>
  :root {
    --bg: #f4f1ea;
    --bg-soft: #ffffff;
    --ink: #23301f;
    --ink-soft: #5b6b53;
    --accent: #3f7d3a;
    --accent-dark: #2c5a2a;
    --accent-soft: #e4efdd;
    --card-border: #ddd6c4;
    --shadow: 0 4px 14px rgba(40, 60, 30, 0.10);
    --chip-bg: #eef2e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171d16;
      --bg-soft: #202a1e;
      --ink: #e9efe4;
      --ink-soft: #a9b8a0;
      --accent: #6fbf5f;
      --accent-dark: #8fd47f;
      --accent-soft: #26361f;
      --card-border: #33402e;
      --shadow: 0 4px 18px rgba(0,0,0,0.35);
      --chip-bg: #263120;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
  }
  header {
    padding: 2.6rem 1.5rem 1.4rem;
    text-align: center;
    background: linear-gradient(180deg, var(--accent-soft), transparent);
  }
  header h1 {
    margin: 0 0 0.4rem;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--accent-dark);
  }
  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.98rem;
  }
  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 0.9rem 1.5rem 1rem;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    justify-content: center;
  }
  .filter-btn {
    border: 1px solid var(--card-border);
    background: var(--bg-soft);
    color: var(--ink);
    padding: 0.45rem 0.95rem;
    border-radius: 999px;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #search {
    flex: 1 1 220px;
    max-width: 320px;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: var(--bg-soft);
    color: var(--ink);
    font-size: 0.9rem;
  }
  #search:focus { outline: 2px solid var(--accent); }
  .count {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin: 1rem 0 0.2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 1.4rem;
    padding: 1.2rem 1.5rem 3rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: var(--bg-soft);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(40,60,30,0.18);
  }
  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--chip-bg);
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
    transition: transform 0.3s ease;
  }
  .card:hover .thumb-wrap img { transform: scale(1.05); }
  .cat-badge {
    position: absolute;
    top: 0.6rem;
    left: 0.6rem;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 0.72rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    backdrop-filter: blur(2px);
  }
  .card-body {
    padding: 0.85rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex: 1;
  }
  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
  }
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: auto;
  }
  .tag {
    font-size: 0.72rem;
    background: var(--chip-bg);
    color: var(--ink-soft);
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
  }
  .source {
    font-size: 0.76rem;
    color: var(--accent);
    font-weight: 600;
  }
  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 3rem 1rem;
    display: none;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 8, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 2rem 1rem;
  }
  .lightbox.open { display: flex; }
  .lightbox-inner {
    max-width: min(900px, 94vw);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 74vh;
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .lightbox-caption {
    color: #f2f2ea;
    text-align: center;
    font-size: 0.95rem;
  }
  .lightbox-caption .source { color: #9be08a; }
  .lb-close, .lb-nav {
    position: absolute;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lb-close:hover, .lb-nav:hover { background: rgba(255,255,255,0.25); }
  .lb-close { top: 1.2rem; right: 1.2rem; }
  .lb-prev { left: 1rem; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 1rem; top: 50%; transform: translateY(-50%); }
  @media (max-width: 640px) {
    .lb-prev, .lb-next { width: 38px; height: 38px; }
  }
  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.8rem;
    padding: 1.5rem 1rem 2.5rem;
  }
</style>
</head>
<body>

<header>
  <h1>🌷 Kertészeti Tudástár</h1>
  <p>Összegyűjtött virág- és kerttippek egy helyen — szűrhető, kereshető kártyagyűjtemény</p>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Keresés (pl. rózsa, hortenzia, szaporítás)…">
  <button class="filter-btn active" data-filter="all">Összes</button>
  <button class="filter-btn" data-filter="fajtak">🌸 Virágfajták</button>
  <button class="filter-btn" data-filter="gondozas">💧 Gondozás</button>
  <button class="filter-btn" data-filter="szaporitas">🌱 Szaporítás</button>
  <button class="filter-btn" data-filter="novenyvedelem">🛡️ Növényvédelem</button>
  <button class="filter-btn" data-filter="zoldseg">🥕 Zöldség &amp; gyümölcs</button>
</div>

<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">Nincs a keresésnek megfelelő találat.</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lightbox-inner">
    <img id="lbImg" src="" alt="">
    <div class="lightbox-caption">
      <div id="lbTitle"></div>
      <div class="source" id="lbSource"></div>
    </div>
  </div>
</div>

<footer>184 kártya · kertikek.hu, kertia.hu, hobbikert.hu, kertlap és egyéb forrásokból mentett tippek</footer>

const grid = document.getElementById("grid");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
let activeFilter = "all";
let activeSearch = "";
let visibleItems = items.slice();

function render() {
  visibleItems = items.filter(it => {
    const catOk = activeFilter === "all" || it.cat === activeFilter;
    const hay = (it.title + " " + it.source + " " + it.tags.join(" ")).toLowerCase();
    const searchOk = !activeSearch || hay.includes(activeSearch);
    return catOk && searchOk;
  });

  grid.innerHTML = visibleItems.map((it, i) => `
    <div class="card" data-idx="${items.indexOf(it)}">
      <div class="thumb-wrap">
        <span class="cat-badge">${CATS[it.cat]}</span>
        <img src="cropped/${it.file}" alt="${it.title}" loading="lazy">
      </div>
      <div class="card-body">
        <div class="card-title">${it.title}</div>
        <div class="source">${it.source}</div>
        <div class="tag-row">${it.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      </div>
    </div>
  `).join("");

  countEl.textContent = `${visibleItems.length} / ${items.length} kártya`;
  emptyEl.style.display = visibleItems.length === 0 ? "block" : "none";

  grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openLightbox(parseInt(card.dataset.idx, 10)));
  });
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById("search").addEventListener("input", (e) => {
  activeSearch = e.target.value.trim().toLowerCase();
  render();
});

// Lightbox
const lightbox = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbTitle = document.getElementById("lbTitle");
const lbSource = document.getElementById("lbSource");
let currentIdx = 0;

function openLightbox(idx) {
  currentIdx = idx;
  showCurrent();
  lightbox.classList.add("open");
}
function showCurrent() {
  const it = items[currentIdx];
  lbImg.src = "cropped/" + it.file;
  lbImg.alt = it.title;
  lbTitle.textContent = it.title;
  lbSource.textContent = it.source;
}
function closeLightbox() { lightbox.classList.remove("open"); }
function step(dir) {
  currentIdx = (currentIdx + dir + items.length) % items.length;
  showCurrent();
}
document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", () => step(-1));
document.getElementById("lbNext").addEventListener("click", () => step(1));
lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", (e) => {
  if (!lightbox.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

render();
</script>
